<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - Pulse Check</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .login-form button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #3B82F6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-form button:hover {
            background: #2563EB;
        }
        .error-message {
            color: #EF4444;
            background: #FEE2E2;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 style="text-align: center; margin-bottom: 30px;">🎓 Teacher Login</h1>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" class="login-form">
            {% if room_id %}
            <input type="hidden" name="room_id" value="{{ room_id }}">
            {% endif %}
            <input type="password" name="password" placeholder="Teacher password" required autofocus>
            <button type="submit">Enter Dashboard</button>
        </form>

        <p style="text-align: center; margin-top: 20px; color: #64748B;">
            <a href="/" style="color: #3B82F6;">← Back to Home</a>
        </p>
    </div>
</body>
</html>
