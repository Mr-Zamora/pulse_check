[uwsgi]
# Application
module = app:app
callable = app

# Process Management
# Multi-process safe: responses are in SQLite (WAL mode handles concurrent writes).
# questions.csv writes are rare (teacher-only) so cross-process csv_lock contention is negligible.
master = true
processes = 4
threads = 8
enable-threads = true

# Performance
lazy-apps = true
thunder-lock = true
harakiri = 60
harakiri-verbose = true
max-requests = 1000
max-requests-delta = 100

# Buffer sizes (CRITICAL FOR PERFORMANCE)
buffer-size = 65536
post-buffering = 8192
socket-timeout = 60
http-timeout = 60

# Logging
disable-logging = false
log-4xx = true
log-5xx = true

# Prevent broken pipe spam
ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true

# Stats
stats = /tmp/uwsgi-stats.sock
memory-report = true

# Reload on code changes (disable in production)
py-autoreload = 1
